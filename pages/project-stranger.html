                <p>香港</p>
                <p1>今日再访香港，对香港仍存异样的熟悉，只要是东涌线的奥运到香港站，港岛线的坚尼地城到铜锣湾站，我敢说我可以全程低头，仅凭脚步的记忆走到目的地。从高铁站出来，被维港海风笼罩之时，觉得全身扭拧，香港的潮湿还是这般滋味，熟悉但又强烈的异乡感将身体朝两极拉扯。</br></br>
香港夜晚的海是墨色的，它因城市灯光显得更深沉。曾在夜晚家里的窗边呓语，淡色的云是被灯火通明的城市照亮的天空，暗色的天空则是包围香港巍峨耸立的山峦，香港在入梦之前成为盆地，在眼前流淌着墨色的海湾。</br></br>
现在，我是北上赶清晨飞机回家的人，化身成高架桥上几分贝的噪声，打扰十年前夜里自己清寂的梦。</p1>
